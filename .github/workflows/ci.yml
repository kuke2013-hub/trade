name: Validate breakout research dashboard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.mjs && node --check engine.mjs && node --check trade-chart.mjs
      - run: node --test tests/engine.test.mjs tests/trade-chart.test.mjs
      - name: Install browser for integration test
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Verify actual dashboard interactions against deterministic market fixtures
        run: node tests/browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-screenshot
          path: dashboard-smoke.png
          if-no-files-found: ignore